---
- name: Setup neovim
  hosts: all
  tags: nvim
  vars:
    nvim_archive_name: "{{ 'nvim-linux-x86_64' if dev_setup_platform == 'ubuntu' else 'nvim-macos-arm64' }}"
    nvim_checksum: "{{ nvim_linux_checksum if dev_setup_platform == 'ubuntu' else nvim_macos_checksum }}"
    golang_archive_name: "{{ 'go' + golang_version + ('.linux-amd64' if dev_setup_platform == 'ubuntu' else '.darwin-arm64') }}"
    golang_checksum: "{{ golang_linux_checksum if dev_setup_platform == 'ubuntu' else golang_macos_checksum }}"
    install_nvim_tools: true
    macos_nvim_formulae:
      - ansible-lint
      - curl
      - ripgrep
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_env.PATH }}"
  tasks:
    - name: Download nvim
      get_url:
        url: "https://github.com/neovim/neovim/releases/download/v{{ nvim_version }}/{{ nvim_archive_name }}.tar.gz"
        dest: "{{ inventory_dir }}/tarballs/{{ nvim_archive_name }}.tar"
        checksum: "sha256:{{ nvim_checksum }}"
        mode: "0644"

    - name: Extract nvim
      unarchive:
        src: "{{ inventory_dir }}/tarballs/{{ nvim_archive_name }}.tar"
        dest: "{{ inventory_dir }}/tarballs"
        remote_src: true
        creates: "{{ inventory_dir }}/tarballs/{{ nvim_archive_name }}/bin/nvim"

    - name: Link nvim installation
      file:
        src: "{{ inventory_dir }}/tarballs/{{ nvim_archive_name }}/bin/nvim"
        dest: "{{ ansible_env.HOME }}/.local/bin/nvim"
        state: link

    - name: Clone nvim-config
      git:
        repo: https://github.com/bagge/nvim-config.git
        dest: "{{ inventory_dir }}/repos/nvim-config"

    - name: Link nvim config
      file:
        src: "{{ inventory_dir }}/repos/nvim-config"
        dest: "{{ ansible_env.HOME }}/.config/nvim"
        state: link

    - name: Install packages used by nvim
      become: true
      apt:
        name: "{{ item }}"
        state: present
      with_items:
        - ansible-lint
        - wl-clipboard
        - ripgrep
        - curl
      when: dev_setup_platform == 'ubuntu'

    - name: Install packages used by nvim on macOS
      community.general.homebrew:
        name: "{{ macos_nvim_formulae }}"
        state: present
        update_homebrew: "{{ homebrew_update | bool }}"
        path: "{{ homebrew_prefix }}/bin"
      when: dev_setup_platform == 'macos'

    - name: Set nvim as default editor for git
      community.general.git_config:
        name: core.editor
        scope: global
        value: nvim

    - name: Download nvm installer
      become: false
      get_url:
        url: "https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh"
        dest: "{{ inventory_dir }}/tarballs/nvm-install-{{ nvm_version }}.sh"
        checksum: "sha256:{{ nvm_install_checksum }}"
        mode: "0755"

    - name: Run nvm installer
      become: false
      command: /bin/bash "{{ inventory_dir }}/tarballs/nvm-install-{{ nvm_version }}.sh"
      environment:
        PROFILE: /dev/null
      args:
        chdir: "{{ ansible_env.HOME }}"
        creates: "{{ ansible_env.HOME }}/.nvm/nvm.sh"

    - name: Install Node.js # noqa command-instead-of-module
      shell: |
        . {{ ansible_env.HOME }}/.nvm/nvm.sh
        if ! nvm version {{ node_major_version }} >/dev/null 2>&1; then
          nvm install {{ node_major_version }}
        fi
      args:
        chdir: "{{ ansible_env.HOME }}"
        executable: /bin/bash
      register: node_install
      changed_when: node_install.stdout | length > 0

    - name: Enable nvm bashrc snippet
      file:
        src: "{{ inventory_dir }}/bashrc.d/{{ item }}"
        dest: "{{ inventory_dir }}/bashrc.d/enabled/{{ item }}"
        state: link
      with_items:
        - "006-nvm.bashrc"

    - name: Download golang
      get_url:
        url: "https://golang.org/dl/{{ golang_archive_name }}.tar.gz"
        dest: "{{ inventory_dir }}/tarballs/{{ golang_archive_name }}.tar"
        checksum: "sha256:{{ golang_checksum }}"
        mode: "0644"

    - name: Extract golang
      unarchive:
        src: "{{ inventory_dir }}/tarballs/{{ golang_archive_name }}.tar"
        dest: "{{ inventory_dir }}/tarballs"
        remote_src: true
        creates: "{{ inventory_dir }}/tarballs/go/bin/go"

    - name: Enable golang bashrc snippet
      file:
        src: "{{ inventory_dir }}/bashrc.d/{{ item }}"
        dest: "{{ inventory_dir }}/bashrc.d/enabled/{{ item }}"
        state: link
      with_items:
        - "007-golang.bashrc"

    - name: Do tool installation in nvim
      shell: >
        {{ ansible_env.HOME }}/.local/bin/nvim --headless -c 'lua m = require("mason").setup()' \
                        -c 'MasonInstall shellcheck shfmt stylua gopls gofumpt' \
                        -c 'MasonInstall goimports lua-language-server' \
                        -c 'MasonInstall ansible-language-server starpls' \
                        -c 'MasonInstall bash-language-server efm' \
                        -c 'MasonInstall yaml-language-server pyright' \
                        -c 'MasonInstall isort black prettierd' \
                        -c 'qall'
      args:
        executable: /bin/bash
        chdir: "{{ ansible_env.HOME }}"
        creates: "{{ ansible_env.HOME }}/.local/share/nvim/mason/bin/shellcheck"
      when: install_nvim_tools | bool
