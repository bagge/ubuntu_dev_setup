---
- name: Setup neovim
  hosts: all
  tags: nvim
  vars:
    nvim_archive_name: "{{ dev_setup_artifacts.nvim_archive_name }}"
    nvim_checksum: "{{ nvim_linux_checksum if dev_setup_platform == 'ubuntu' else nvim_macos_checksum }}"
    golang_archive_name: "go{{ golang_version }}.{{ dev_setup_artifacts.golang_target }}"
    golang_checksum: "{{ golang_linux_checksum if dev_setup_platform == 'ubuntu' else golang_macos_checksum }}"
    install_nvim_tools: true
    macos_nvim_formulae:
      - ansible-lint
      - curl
      - graphviz
      - openjdk
      - ripgrep
      - tree-sitter-cli
    plantuml_jar_name: "plantuml-{{ plantuml_version }}.jar"
    rustup_target: x86_64-unknown-linux-gnu
    rustup_init_name: "rustup-init-{{ rustup_version }}-{{ rustup_target }}"
    vale_config_dir: >-
      {{ ansible_facts.env.HOME }}/{{ 'Library/Application Support/vale' if dev_setup_platform == 'macos' else '.config/vale' }}
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.HOME }}/.local/bin:{{ ansible_facts.env.HOME }}/.cargo/bin:{{ ansible_facts.env.PATH }}"
  tasks:
    - name: Download nvim
      ansible.builtin.get_url:
        url: "https://github.com/neovim/neovim/releases/download/v{{ nvim_version }}/{{ nvim_archive_name }}.tar.gz"
        dest: "{{ inventory_dir }}/tarballs/{{ nvim_archive_name }}.tar"
        checksum: "sha256:{{ nvim_checksum }}"
        mode: "0644"
      register: nvim_download

    - name: Remove old nvim before re-extracting
      ansible.builtin.file:
        path: "{{ inventory_dir }}/tarballs/{{ nvim_archive_name }}"
        state: absent
      when: nvim_download.changed # noqa: no-handler

    - name: Extract nvim
      ansible.builtin.unarchive:
        src: "{{ inventory_dir }}/tarballs/{{ nvim_archive_name }}.tar"
        dest: "{{ inventory_dir }}/tarballs"
        remote_src: true
      when: nvim_download.changed # noqa: no-handler

    - name: Create local bin directory
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Link nvim installation
      ansible.builtin.file:
        src: "{{ inventory_dir }}/tarballs/{{ nvim_archive_name }}/bin/nvim"
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/nvim"
        state: link

    - name: Install packages used by nvim
      become: true
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items:
        - ansible-lint
        - build-essential
        - curl
        - default-jre
        - git
        - graphviz
        - libclang-dev
        - python3-venv
        - ripgrep
        - wl-clipboard
      when: dev_setup_platform == 'ubuntu'

    - name: Install packages used by nvim on macOS
      community.general.homebrew:
        name: "{{ macos_nvim_formulae }}"
        state: present
        update_homebrew: "{{ homebrew_update | bool }}"
        path: "{{ homebrew_prefix }}/bin"
      when: dev_setup_platform == 'macos'

    - name: Clone nvim-config # noqa latest[git]
      ansible.builtin.git:
        repo: https://github.com/bagge/nvim-config.git
        dest: "{{ inventory_dir }}/repos/nvim-config"

    - name: Link nvim config
      ansible.builtin.include_tasks: tasks/guarded-link.yml
      vars:
        guarded_link_src: "{{ inventory_dir }}/repos/nvim-config"
        guarded_link_dest: "{{ ansible_facts.env.HOME }}/.config/nvim"

    - name: Create Vale config directory
      ansible.builtin.file:
        path: "{{ vale_config_dir }}"
        state: directory
        mode: "0755"

    - name: Link Vale configuration
      ansible.builtin.include_tasks: tasks/guarded-link.yml
      vars:
        guarded_link_src: "{{ inventory_dir }}/vale.ini"
        guarded_link_dest: "{{ vale_config_dir }}/.vale.ini"

    - name: Set nvim as default editor for git
      community.general.git_config:
        name: core.editor
        scope: global
        value: nvim

    - name: Enable nvim bashrc snippet
      ansible.builtin.file:
        src: "{{ inventory_dir }}/bashrc.d/{{ item }}"
        dest: "{{ inventory_dir }}/bashrc.d/enabled/{{ item }}"
        state: link
      with_items:
        - "006-nvim.bashrc"

    - name: Download PlantUML jar
      ansible.builtin.get_url:
        url: "https://github.com/plantuml/plantuml/releases/download/v{{ plantuml_version }}/{{ plantuml_jar_name }}"
        dest: "{{ inventory_dir }}/tarballs/{{ plantuml_jar_name }}"
        checksum: "sha256:{{ plantuml_checksum }}"
        mode: "0644"

    - name: Link PlantUML jar
      ansible.builtin.file:
        src: "{{ inventory_dir }}/tarballs/{{ plantuml_jar_name }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/plantuml.jar"
        state: link

    - name: Link PlantUML wrapper
      ansible.builtin.file:
        src: "{{ inventory_dir }}/plantuml.sh"
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/plantuml"
        state: link

    - name: Download nvm installer
      become: false
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh"
        dest: "{{ inventory_dir }}/tarballs/nvm-install-{{ nvm_version }}.sh"
        checksum: "sha256:{{ nvm_install_checksum }}"
        mode: "0755"

    - name: Read installed nvm version # noqa command-instead-of-module
      become: false
      ansible.builtin.shell: |
        if [ -s "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh" ]; then
          . "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
          nvm --version
        fi
      args:
        chdir: "{{ ansible_facts.env.HOME }}"
        executable: /bin/bash
      register: nvm_installed_version
      changed_when: false

    - name: Run nvm installer
      become: false
      ansible.builtin.command: /bin/bash "{{ inventory_dir }}/tarballs/nvm-install-{{ nvm_version }}.sh"
      environment:
        PROFILE: /dev/null
      args:
        chdir: "{{ ansible_facts.env.HOME }}"
      when: nvm_installed_version.stdout != nvm_version
      changed_when: true

    - name: Install Node.js # noqa command-instead-of-module
      ansible.builtin.shell: |
        . "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
        changed=0
        if ! nvm version {{ node_major_version }} >/dev/null 2>&1; then
          nvm install {{ node_major_version }}
          changed=1
        fi
        default_version="$(nvm version default 2>/dev/null || true)"
        if [[ "${default_version}" != v{{ node_major_version }}.* ]]; then
          nvm alias default {{ node_major_version }} >/dev/null
          changed=1
        fi
        if [ "${changed}" -eq 1 ]; then
          echo "__node_changed__"
        fi
      args:
        chdir: "{{ ansible_facts.env.HOME }}"
        executable: /bin/bash
      register: node_install
      changed_when: "'__node_changed__' in node_install.stdout"

    - name: Enable nvm bashrc snippet
      ansible.builtin.file:
        src: "{{ inventory_dir }}/bashrc.d/{{ item }}"
        dest: "{{ inventory_dir }}/bashrc.d/enabled/{{ item }}"
        state: link
      with_items:
        - "006-nvm.bashrc"

    - name: Download rustup-init on Ubuntu
      ansible.builtin.get_url:
        url: "https://static.rust-lang.org/rustup/archive/{{ rustup_version }}/{{ rustup_target }}/rustup-init"
        dest: "{{ inventory_dir }}/tarballs/{{ rustup_init_name }}"
        checksum: "sha256:{{ rustup_init_linux_checksum }}"
        mode: "0755"
      when: dev_setup_platform == 'ubuntu'

    - name: Install Rust toolchain on Ubuntu
      ansible.builtin.command: >
        {{ inventory_dir }}/tarballs/{{ rustup_init_name }}
        -y --no-modify-path --profile minimal --default-toolchain stable
      environment:
        CARGO_HOME: "{{ ansible_facts.env.HOME }}/.cargo"
        RUSTUP_HOME: "{{ ansible_facts.env.HOME }}/.rustup"
      args:
        creates: "{{ ansible_facts.env.HOME }}/.cargo/bin/rustup"
      when: dev_setup_platform == 'ubuntu'

    - name: Ensure stable Rust toolchain on Ubuntu
      ansible.builtin.command: >
        {{ ansible_facts.env.HOME }}/.cargo/bin/rustup toolchain install stable --profile minimal
      environment:
        CARGO_HOME: "{{ ansible_facts.env.HOME }}/.cargo"
        RUSTUP_HOME: "{{ ansible_facts.env.HOME }}/.rustup"
      register: rust_stable_toolchain
      changed_when: >-
        'installed' in rust_stable_toolchain.stdout
        or 'installing' in rust_stable_toolchain.stdout
        or 'updated' in rust_stable_toolchain.stdout
        or 'installed' in rust_stable_toolchain.stderr
        or 'installing' in rust_stable_toolchain.stderr
        or 'updated' in rust_stable_toolchain.stderr
      when: dev_setup_platform == 'ubuntu'

    - name: Check installed vale-ls binary on Ubuntu 22.04
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.local/bin/vale-ls"
      register: vale_ls_binary
      when:
        - dev_setup_platform == 'ubuntu'
        - ansible_facts.distribution_version == '22.04'

    - name: Read installed vale-ls version marker on Ubuntu 22.04
      ansible.builtin.slurp:
        src: "{{ ansible_facts.env.HOME }}/.local/.vale-ls-version"
      register: vale_ls_version_marker
      failed_when: false
      when:
        - dev_setup_platform == 'ubuntu'
        - ansible_facts.distribution_version == '22.04'

    - name: Install vale-ls on Ubuntu 22.04
      ansible.builtin.command: >
        {{ ansible_facts.env.HOME }}/.cargo/bin/cargo +stable install
        --git https://github.com/vale-cli/vale-ls
        --tag v{{ vale_ls_version }}
        --locked
        --root {{ ansible_facts.env.HOME }}/.local
        --force
      environment:
        CARGO_HOME: "{{ ansible_facts.env.HOME }}/.cargo"
        RUSTUP_HOME: "{{ ansible_facts.env.HOME }}/.rustup"
      changed_when: true
      when:
        - dev_setup_platform == 'ubuntu'
        - ansible_facts.distribution_version == '22.04'
        - >-
          not vale_ls_binary.stat.exists
          or vale_ls_version_marker.content is not defined
          or (vale_ls_version_marker.content | b64decode | trim) != vale_ls_version

    - name: Write vale-ls version marker on Ubuntu 22.04
      ansible.builtin.copy:
        content: "{{ vale_ls_version }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/.vale-ls-version"
        mode: "0644"
      when:
        - dev_setup_platform == 'ubuntu'
        - ansible_facts.distribution_version == '22.04'

    - name: Read installed tree-sitter CLI version on Ubuntu # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/tree-sitter --version"
      register: tree_sitter_cli_version
      changed_when: false
      failed_when: false
      when: dev_setup_platform == 'ubuntu'

    - name: Create source repository directory on Ubuntu
      ansible.builtin.file:
        path: "{{ inventory_dir }}/repos"
        state: directory
        mode: "0755"
      when: dev_setup_platform == 'ubuntu'

    - name: Clone tree-sitter source on Ubuntu
      ansible.builtin.git:
        repo: https://github.com/tree-sitter/tree-sitter.git
        dest: "{{ inventory_dir }}/repos/tree-sitter"
        version: "v{{ tree_sitter_version }}"
      when: dev_setup_platform == 'ubuntu'

    - name: Build and install tree-sitter CLI on Ubuntu
      ansible.builtin.command: >
        {{ ansible_facts.env.HOME }}/.cargo/bin/cargo +stable install
        --locked --path crates/cli --root {{ ansible_facts.env.HOME }}/.local
      environment:
        CARGO_HOME: "{{ ansible_facts.env.HOME }}/.cargo"
        RUSTUP_HOME: "{{ ansible_facts.env.HOME }}/.rustup"
      args:
        chdir: "{{ inventory_dir }}/repos/tree-sitter"
      changed_when: true
      when:
        - dev_setup_platform == 'ubuntu'
        - tree_sitter_cli_version.rc != 0 or tree_sitter_cli_version.stdout is not match("^tree-sitter " + tree_sitter_version + "( |$)")

    - name: Download golang
      ansible.builtin.get_url:
        url: "https://golang.org/dl/{{ golang_archive_name }}.tar.gz"
        dest: "{{ inventory_dir }}/tarballs/{{ golang_archive_name }}.tar"
        checksum: "sha256:{{ golang_checksum }}"
        mode: "0644"
      register: golang_download

    - name: Remove old golang before re-extracting
      ansible.builtin.file:
        path: "{{ inventory_dir }}/tarballs/go"
        state: absent
      when: golang_download.changed # noqa: no-handler

    - name: Extract golang
      ansible.builtin.unarchive:
        src: "{{ inventory_dir }}/tarballs/{{ golang_archive_name }}.tar"
        dest: "{{ inventory_dir }}/tarballs"
        remote_src: true
      when: golang_download.changed # noqa: no-handler

    - name: Enable golang bashrc snippet
      ansible.builtin.file:
        src: "{{ inventory_dir }}/bashrc.d/{{ item }}"
        dest: "{{ inventory_dir }}/bashrc.d/enabled/{{ item }}"
        state: link
      with_items:
        - "007-golang.bashrc"

    - name: Sync nvim plugins
      ansible.builtin.command: >
        {{ ansible_facts.env.HOME }}/.local/bin/nvim --headless '+Lazy! restore' +qa
      args:
        chdir: "{{ ansible_facts.env.HOME }}"
      changed_when: false
      when: install_nvim_tools | bool

    - name: Do tool installation in nvim
      ansible.builtin.shell: |
        export NVM_DIR="{{ ansible_facts.env.HOME }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        export PATH="{{ inventory_dir }}/tarballs/go/bin:$PATH"
        {{ ansible_facts.env.HOME }}/.local/bin/nvim --headless \
          '+MasonToolsInstallSync' +qa
      args:
        executable: /bin/bash
        chdir: "{{ ansible_facts.env.HOME }}"
      changed_when: false
      when: install_nvim_tools | bool
