---
- name: Some extra stuff that is nice to have around
  hosts: all
  tags: extras
  vars:
    toprepo_asset: "git-toprepo-{{ toprepo_version }}-{{ dev_setup_artifacts.toprepo_target }}"
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.HOME }}/.cargo/bin:{{ ansible_facts.env.PATH }}"
  tasks:
    - name: Install other apt packages on Ubuntu
      become: true
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items:
        - bmon
        - curl
        - git
        - graphviz
        - jq
        - python3-pip
        - python3-venv
        - remmina
        - virt-manager
      when: dev_setup_platform == 'ubuntu'

    - name: Install apt packages not installable in Github Actions on Ubuntu
      become: true
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items:
        - docker.io
      when:
        - dev_setup_platform == 'ubuntu'
        - install_docker | bool

    - name: Download toprepo on Ubuntu
      ansible.builtin.get_url:
        url: "https://github.com/meroton/git-toprepo/releases/download/{{ toprepo_version }}/{{ toprepo_asset }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/git-toprepo"
        checksum: "sha256:{{ toprepo_linux_checksum }}"
        mode: "0755"
      when: dev_setup_platform == 'ubuntu'

    - name: Check installed toprepo version marker on macOS
      ansible.builtin.slurp:
        src: "{{ ansible_facts.env.HOME }}/.local/.toprepo-version"
      register: toprepo_marker
      failed_when: false
      when: dev_setup_platform == 'macos'

    - name: Install toprepo on macOS
      ansible.builtin.command: >
        cargo install --git https://github.com/meroton/git-toprepo.git
        --tag {{ toprepo_version }} --root {{ ansible_facts.env.HOME }}/.local
      changed_when: true
      when:
        - dev_setup_platform == 'macos'
        - toprepo_marker.content is not defined or (toprepo_marker.content | b64decode | trim) != toprepo_version

    - name: Write toprepo version marker on macOS
      ansible.builtin.copy:
        content: "{{ toprepo_version }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/.toprepo-version"
        mode: "0644"
      when: dev_setup_platform == 'macos'

    - name: Add Google Chrome signing key on Ubuntu
      become: true
      ansible.builtin.apt_key:
        url: https://dl.google.com/linux/linux_signing_key.pub
        keyring: /usr/share/keyrings/google-chrome.gpg
        state: present
      when:
        - dev_setup_platform == 'ubuntu'
        - install_google_chrome | bool

    - name: Add Google Chrome apt repository on Ubuntu
      become: true
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main"
        filename: google-chrome
        state: present
      when:
        - dev_setup_platform == 'ubuntu'
        - install_google_chrome | bool

    - name: Install google-chrome-stable on Ubuntu
      become: true
      ansible.builtin.apt:
        name: google-chrome-stable
        update_cache: true
        state: present
      when:
        - dev_setup_platform == 'ubuntu'
        - install_google_chrome | bool

    - name: Install google-chrome on macOS
      community.general.homebrew_cask:
        name: google-chrome
        state: present
        update_homebrew: "{{ homebrew_update | bool }}"
      when:
        - dev_setup_platform == 'macos'
        - install_google_chrome | bool

    - name: Install omnissa-horizon-client on macOS
      community.general.homebrew_cask:
        name: omnissa-horizon-client
        state: present
        update_homebrew: "{{ homebrew_update | bool }}"
      when:
        - dev_setup_platform == 'macos'
        - install_omnissa_horizon | bool

    - name: Download vmware-horizon-client on Ubuntu
      ansible.builtin.get_url:
        url: "{{ horizon_url }}/{{ horizon_deb }}"
        dest: "{{ inventory_dir }}/tarballs/{{ horizon_deb }}"
        checksum: "sha256:{{ horizon_deb_checksum }}"
        mode: "0644"
      when:
        - dev_setup_platform == 'ubuntu'
        - install_omnissa_horizon | bool

    - name: Install vmware-horizon-client on Ubuntu
      become: true
      ansible.builtin.apt:
        deb: "{{ inventory_dir }}/tarballs/{{ horizon_deb }}"
        state: present
      when:
        - dev_setup_platform == 'ubuntu'
        - install_omnissa_horizon | bool
