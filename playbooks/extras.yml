---
- name: Some extra stuff that is nice to have around
  hosts: all
  tags: extras
  vars:
    chrome_deb: "google-chrome-stable_current_amd64.deb"
    install_docker: "{{ ansible_env.IS_GITHUB_CI is not defined }}"
    install_proprietary_extras: true
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
  tasks:
    - name: Install other apt packages on Ubuntu
      become: true
      apt:
        name: "{{ item }}"
        state: present
      with_items:
        - bmon
        - curl
        - git
        - graphviz
        - jq
        - python3-pip
        - python3-venv
        - virt-manager
      when: dev_setup_platform == 'ubuntu'

    - name: Install apt packages not installable in Github Actions on Ubuntu
      become: true
      apt:
        name: "{{ item }}"
        state: present
      with_items:
        - docker.io
      when:
        - dev_setup_platform == 'ubuntu'
        - install_docker | bool

    - name: Download toprepo on Ubuntu
      get_url:
        url: "https://github.com/meroton/git-toprepo/releases/download/{{ toprepo_version }}/git-toprepo-{{ toprepo_version }}-linux-x86_64"
        dest: "{{ ansible_env.HOME }}/.local/bin/git-toprepo"
        mode: "0755"
      when: dev_setup_platform == 'ubuntu'

    - name: Install toprepo on macOS
      command: >
        cargo install --git https://github.com/meroton/git-toprepo.git
        --tag {{ toprepo_version }} --root {{ ansible_env.HOME }}/.local
      args:
        creates: "{{ ansible_env.HOME }}/.local/bin/git-toprepo"
      when: dev_setup_platform == 'macos'

    - name: Download google-chrome-stable on Ubuntu
      get_url:
        url: "https://dl.google.com/linux/direct/{{ chrome_deb }}"
        dest: "{{ inventory_dir }}/tarballs/{{ chrome_deb }}"
        mode: "0644"
      when:
        - dev_setup_platform == 'ubuntu'
        - install_proprietary_extras | bool

    - name: Install google-chrome-stable on Ubuntu
      become: true
      apt:
        deb: "{{ inventory_dir }}/tarballs/{{ chrome_deb }}"
        state: present
      when:
        - dev_setup_platform == 'ubuntu'
        - install_proprietary_extras | bool

    - name: Install proprietary casks on macOS
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: present
        update_homebrew: "{{ homebrew_update | bool }}"
      loop:
        - google-chrome
        - omnissa-horizon-client
      when:
        - dev_setup_platform == 'macos'
        - install_proprietary_extras | bool

    - name: Download vmware-horizon-client on Ubuntu
      get_url:
        url: "{{ horizon_url }}/{{ horizon_deb }}"
        dest: "{{ inventory_dir }}/tarballs/{{ horizon_deb }}"
        mode: "0644"
      when:
        - dev_setup_platform == 'ubuntu'
        - install_proprietary_extras | bool

    - name: Install vmware-horizon-client on Ubuntu
      become: true
      apt:
        deb: "{{ inventory_dir }}/tarballs/{{ horizon_deb }}"
        state: present
      when:
        - dev_setup_platform == 'ubuntu'
        - install_proprietary_extras | bool
