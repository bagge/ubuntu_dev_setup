---
- name: Common pre-requisites
  hosts: all
  tags: common
  vars:
    google_chrome_apt_list_path: /etc/apt/sources.list.d/google-chrome.list
    google_chrome_apt_repo: >-
      deb [arch=amd64 signed-by={{ google_chrome_keyring_path }}]
      https://dl.google.com/linux/chrome/deb/ stable main
    google_chrome_apt_sources_path: /etc/apt/sources.list.d/google-chrome.sources
    google_chrome_default_path: /etc/default/google-chrome
    google_chrome_keyring_path: /usr/share/keyrings/google-chrome.gpg
    macos_common_formulae:
      - bash
      - bmon
      - curl
      - fzf
      - git
      - graphviz
      - jq
      - python
      - rust
      - shellcheck
      - shfmt
      - stylua
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
  tasks:
    - name: Check if needrestart is installed
      ansible.builtin.stat:
        path: /etc/needrestart
      register: needrestart_dir
      when: dev_setup_platform == 'ubuntu'

    - name: Prevent needrestart from restarting xrdp during apt operations
      become: true
      ansible.builtin.copy:
        dest: /etc/needrestart/conf.d/no-xrdp.conf
        content: |
          # Prevent automatic xrdp restarts which kill active RDP sessions
          $nrconf{override_rc}{qr(^xrdp)} = 0;
        mode: "0644"
      when:
        - dev_setup_platform == 'ubuntu'
        - needrestart_dir.stat.isdir is defined
        - needrestart_dir.stat.isdir

    - name: Check Google Chrome apt repository list on Ubuntu
      ansible.builtin.stat:
        path: "{{ google_chrome_apt_list_path }}"
      register: google_chrome_apt_list
      when: dev_setup_platform == 'ubuntu'

    - name: Check Google Chrome deb822 apt repository on Ubuntu
      ansible.builtin.stat:
        path: "{{ google_chrome_apt_sources_path }}"
      register: google_chrome_apt_sources
      when: dev_setup_platform == 'ubuntu'

    - name: Decide whether to normalize Google Chrome apt source on Ubuntu
      ansible.builtin.set_fact:
        normalize_google_chrome_apt_source: >-
          {{
            install_google_chrome | bool
            or google_chrome_apt_list.stat.exists | default(false)
            or google_chrome_apt_sources.stat.exists | default(false)
          }}
      when: dev_setup_platform == 'ubuntu'

    - name: Add Google Chrome signing key on Ubuntu
      become: true
      ansible.builtin.apt_key:
        url: https://dl.google.com/linux/linux_signing_key.pub
        keyring: "{{ google_chrome_keyring_path }}"
        state: present
      when:
        - dev_setup_platform == 'ubuntu'
        - normalize_google_chrome_apt_source | default(false) | bool

    - name: Disable Google Chrome automatic apt source management on Ubuntu
      become: true
      ansible.builtin.copy:
        dest: "{{ google_chrome_default_path }}"
        content: |
          repo_add_once="false"
          repo_reenable_on_distupgrade="false"
        mode: "0644"
      when:
        - dev_setup_platform == 'ubuntu'
        - normalize_google_chrome_apt_source | default(false) | bool

    - name: Remove Google Chrome deb822 apt repository on Ubuntu
      become: true
      ansible.builtin.file:
        path: "{{ google_chrome_apt_sources_path }}"
        state: absent
      when:
        - dev_setup_platform == 'ubuntu'
        - normalize_google_chrome_apt_source | default(false) | bool

    - name: Normalize Google Chrome apt repository list on Ubuntu
      become: true
      ansible.builtin.copy:
        dest: "{{ google_chrome_apt_list_path }}"
        content: |
          ### THIS FILE IS MANAGED BY ANSIBLE ###
          {{ google_chrome_apt_repo }}
        mode: "0644"
      when:
        - dev_setup_platform == 'ubuntu'
        - normalize_google_chrome_apt_source | default(false) | bool

    - name: Install python3-psutil (needed by dconf module)
      become: true
      ansible.builtin.apt:
        name: python3-psutil
        update_cache: true
        state: present
      when: dev_setup_platform == 'ubuntu'

    - name: Install common Homebrew formulae on macOS
      community.general.homebrew:
        name: "{{ macos_common_formulae }}"
        state: present
        update_homebrew: "{{ homebrew_update | bool }}"
        path: "{{ homebrew_prefix }}/bin"
      when: dev_setup_platform == 'macos'

    - name: Create tarballs directory
      ansible.builtin.file:
        path: "{{ inventory_dir }}/tarballs"
        state: directory
        mode: "0755"
