---
- name: Create Google Chrome apt keyring directory on Ubuntu
  become: "{{ google_chrome_apt_source_become | default(true) }}"
  ansible.builtin.file:
    path: "{{ google_chrome_keyring_path | dirname }}"
    state: directory
    mode: "0755"

- name: Download Google Chrome signing key on Ubuntu
  become: "{{ google_chrome_apt_source_become | default(true) }}"
  ansible.builtin.get_url:
    url: "{{ google_chrome_signing_key_url }}"
    dest: "{{ google_chrome_keyring_path }}"
    mode: "0644"

- name: Disable Google Chrome automatic apt source management on Ubuntu
  become: "{{ google_chrome_apt_source_become | default(true) }}"
  ansible.builtin.copy:
    dest: "{{ google_chrome_default_path }}"
    content: |
      repo_add_once="false"
      repo_reenable_on_distupgrade="false"
    mode: "0644"

- name: Remove legacy Google Chrome apt repository list on Ubuntu
  become: "{{ google_chrome_apt_source_become | default(true) }}"
  ansible.builtin.file:
    path: "{{ google_chrome_apt_list_path }}"
    state: absent

- name: Remove legacy Google Chrome binary keyring on Ubuntu
  become: "{{ google_chrome_apt_source_become | default(true) }}"
  ansible.builtin.file:
    path: "{{ google_chrome_legacy_keyring_path }}"
    state: absent

- name: Manage Google Chrome deb822 apt repository on Ubuntu
  become: "{{ google_chrome_apt_source_become | default(true) }}"
  ansible.builtin.copy:
    dest: "{{ google_chrome_apt_sources_path }}"
    content: |
      Types: deb
      URIs: https://dl.google.com/linux/chrome/deb/
      Suites: stable
      Components: main
      Architectures: amd64
      Signed-By: {{ google_chrome_keyring_path }}
    mode: "0644"
