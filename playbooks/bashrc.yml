---
- name: Configure .bashrc
  hosts: all
  tags: always, bashrc
  tasks:
    - name: Link bashrc-snippets to home directory
      ansible.builtin.file:
        src: "{{ inventory_dir }}/bashrc.d"
        dest: "{{ ansible_env.HOME }}/.bashrc.d"
        state: link

    - name: Link bashrc to home directory
      ansible.builtin.include_tasks: tasks/guarded-link.yml
      vars:
        guarded_link_src: "{{ inventory_dir }}/bashrc"
        guarded_link_dest: "{{ ansible_env.HOME }}/.bashrc"

    - name: Link bash_profile to home directory on macOS
      ansible.builtin.include_tasks: tasks/guarded-link.yml
      vars:
        guarded_link_src: "{{ inventory_dir }}/bash_profile"
        guarded_link_dest: "{{ ansible_env.HOME }}/.bash_profile"
      when: dev_setup_platform == 'macos'

    - name: Enable default bashrc snippets
      ansible.builtin.file:
        src: "{{ inventory_dir }}/bashrc.d/{{ item }}"
        dest: "{{ inventory_dir }}/bashrc.d/enabled/{{ item }}"
        state: link
      with_items:
        - "000-setup-location.bashrc"
        - "004-bash-history.bashrc"
        - "999-optional-auth.bashrc"

    - name: Enable Homebrew bashrc snippet on macOS
      ansible.builtin.file:
        src: "{{ inventory_dir }}/bashrc.d/{{ item }}"
        dest: "{{ inventory_dir }}/bashrc.d/enabled/{{ item }}"
        state: link
      with_items:
        - "001-homebrew.bashrc"
      when: dev_setup_platform == 'macos'

    - name: Allow Homebrew Bash as a login shell on macOS
      become: true
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: "{{ homebrew_prefix }}/bin/bash"
        state: present
      when:
        - dev_setup_platform == 'macos'
        - macos_set_login_shell | bool

    - name: Read current login shell on macOS
      ansible.builtin.command: dscl . -read "/Users/{{ ansible_user_id }}" UserShell
      register: macos_login_shell
      changed_when: false
      when:
        - dev_setup_platform == 'macos'
        - macos_set_login_shell | bool

    - name: Set Homebrew Bash as login shell on macOS
      become: true
      ansible.builtin.command: chsh -s "{{ homebrew_prefix }}/bin/bash" "{{ ansible_user_id }}"
      changed_when: true
      when:
        - dev_setup_platform == 'macos'
        - macos_set_login_shell | bool
        - homebrew_prefix + '/bin/bash' not in macos_login_shell.stdout
