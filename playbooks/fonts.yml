---
- name: Install fonts
  hosts: all
  tags: fonts
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
  tasks:
    - name: Install Hack Nerd Font on macOS
      community.general.homebrew_cask:
        name: font-hack-nerd-font
        state: present
        update_homebrew: "{{ homebrew_update | bool }}"
      when: dev_setup_platform == 'macos'

    - name: Create font directory on Ubuntu
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
        state: directory
        mode: "0755"
      when: dev_setup_platform == 'ubuntu'

    - name: Download fonts on Ubuntu
      ansible.builtin.get_url:
        url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ nerd_fonts_version }}/Hack.zip"
        dest: "{{ inventory_dir }}/tarballs/Hack.zip"
        checksum: "sha256:{{ nerd_fonts_hack_checksum }}"
        mode: "0644"
      when: dev_setup_platform == 'ubuntu'

    - name: Check installed Hack Nerd Font on Ubuntu
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.local/share/fonts/HackNerdFont-Regular.ttf"
      register: nerd_fonts_hack_regular
      when: dev_setup_platform == 'ubuntu'

    - name: Read installed Hack Nerd Font version on Ubuntu
      ansible.builtin.slurp:
        src: "{{ ansible_facts.env.HOME }}/.local/share/fonts/.hack-nerd-font-version"
      register: nerd_fonts_version_marker
      failed_when: false
      when: dev_setup_platform == 'ubuntu'

    - name: Extract fonts on Ubuntu
      ansible.builtin.unarchive:
        src: "{{ inventory_dir }}/tarballs/Hack.zip"
        dest: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
        remote_src: true
      when:
        - dev_setup_platform == 'ubuntu'
        - >-
          not nerd_fonts_hack_regular.stat.exists
          or nerd_fonts_version_marker.content is not defined
          or (nerd_fonts_version_marker.content | b64decode | trim) != nerd_fonts_version

    - name: Write installed Hack Nerd Font version on Ubuntu
      ansible.builtin.copy:
        content: "{{ nerd_fonts_version }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/share/fonts/.hack-nerd-font-version"
        mode: "0644"
      when: dev_setup_platform == 'ubuntu'

    - name: Update font cache on Ubuntu
      ansible.builtin.command: fc-cache -f -v
      changed_when: false
      when: dev_setup_platform == 'ubuntu'
