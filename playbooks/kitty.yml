---
- name: Setup kitty
  hosts: all
  tags: kitty
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
  tasks:
    - name: Install kitty on macOS
      community.general.homebrew_cask:
        name: kitty
        state: present
        update_homebrew: "{{ homebrew_update | bool }}"
      when: dev_setup_platform == 'macos'

    - name: Download kitty release on Ubuntu
      ansible.builtin.get_url:
        url: "https://github.com/kovidgoyal/kitty/releases/download/v{{ kitty_version }}/kitty-{{ kitty_version }}-{{ dev_setup_artifacts.kitty_target }}.txz"
        dest: "{{ inventory_dir }}/tarballs/kitty-{{ kitty_version }}-{{ dev_setup_artifacts.kitty_target }}.tar"
        checksum: "sha256:{{ kitty_linux_checksum }}"
        mode: "0644"
      register: kitty_download
      when: dev_setup_platform == 'ubuntu'

    - name: Remove old kitty.app before re-extracting on Ubuntu
      ansible.builtin.file:
        path: "{{ inventory_dir }}/tarballs/kitty.app"
        state: absent
      when:
        - dev_setup_platform == 'ubuntu'
        - kitty_download.changed # noqa: no-handler

    - name: Create directory for kitty.app on Ubuntu
      ansible.builtin.file:
        path: "{{ inventory_dir }}/tarballs/kitty.app"
        state: directory
        mode: "0755"
      when:
        - dev_setup_platform == 'ubuntu'
        - kitty_download.changed # noqa: no-handler

    - name: Extract kitty tarball on Ubuntu
      ansible.builtin.unarchive:
        src: "{{ inventory_dir }}/tarballs/kitty-{{ kitty_version }}-{{ dev_setup_artifacts.kitty_target }}.tar"
        dest: "{{ inventory_dir }}/tarballs/kitty.app"
        remote_src: true
      when:
        - dev_setup_platform == 'ubuntu'
        - kitty_download.changed # noqa: no-handler

    - name: Fix kitty path in desktop files on Ubuntu
      ansible.builtin.replace:
        path: "{{ inventory_dir }}/tarballs/kitty.app/share/applications/{{ item }}"
        regexp: 'Exec=kitty'
        replace: 'Exec={{ ansible_facts.env.HOME }}/.local/bin/kitty'
      with_items:
        - kitty.desktop
        - kitty-open.desktop
      when: dev_setup_platform == 'ubuntu'

    - name: Fix kitty icon path in desktop files on Ubuntu
      ansible.builtin.replace:
        path: "{{ inventory_dir }}/tarballs/kitty.app/share/applications/{{ item }}"
        regexp: 'Icon=kitty'
        replace: 'Icon={{ ansible_facts.env.HOME }}/.local/kitty.app/share/icons/hicolor/256x256/apps/kitty.png'
      with_items:
        - kitty.desktop
        - kitty-open.desktop
      when: dev_setup_platform == 'ubuntu'

    - name: Create destination directory for desktop files on Ubuntu
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/share/applications"
        state: directory
        mode: "0775"
      when: dev_setup_platform == 'ubuntu'

    - name: Install kitty desktop file on Ubuntu
      ansible.builtin.copy:
        src: "{{ inventory_dir }}/tarballs/kitty.app/share/applications/{{ item }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/share/applications/{{ item }}"
        mode: "0644"
      with_items:
        - kitty.desktop
        - kitty-open.desktop
      when: dev_setup_platform == 'ubuntu'

    - name: Create config directory
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config"
        state: directory
        mode: "0755"

    - name: Make xdg-terminal-exec (and hence desktop environments that support it use kitty)
      ansible.builtin.copy:
        content: |
          kitty.desktop
        dest: "{{ ansible_facts.env.HOME }}/.config/xdg-terminals.list"
        mode: "0644"
      when: dev_setup_platform == 'ubuntu'

    - name: Detect usable Ubuntu GNOME session for default terminal
      ansible.builtin.set_fact:
        kitty_ubuntu_gnome_customization_available: >-
          {{
            dev_setup_platform == 'ubuntu'
            and run_desktop_customization | default(run_gnome_customization | default(true)) | bool
            and (
              'GNOME' in ansible_facts.env.XDG_CURRENT_DESKTOP | default('')
              or 'gnome' in ansible_facts.env.XDG_SESSION_DESKTOP | default('') | lower
              or 'gnome' in ansible_facts.env.DESKTOP_SESSION | default('') | lower
            )
            and ansible_facts.env.DISPLAY | default('') | length > 0
            and ansible_facts.env.DBUS_SESSION_BUS_ADDRESS | default('') | length > 0
          }}
      when: dev_setup_platform == 'ubuntu'

    - name: Configure gnome to use kitty as default terminal
      ansible.builtin.command: gsettings set org.gnome.desktop.default-applications.terminal exec "{{ ansible_facts.env.HOME }}/.local/bin/kitty"
      changed_when: false
      when:
        - dev_setup_platform == 'ubuntu'
        - kitty_ubuntu_gnome_customization_available | default(false) | bool

    - name: Create kitty config directory
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/kitty"
        state: directory
        mode: "0755"

    - name: Install kitty configuration
      ansible.builtin.include_tasks: tasks/guarded-link.yml
      vars:
        guarded_link_src: "{{ inventory_dir }}/kitty.conf"
        guarded_link_dest: "{{ ansible_facts.env.HOME }}/.config/kitty/kitty.conf"

    - name: Install kitty tab bar renderer
      ansible.builtin.include_tasks: tasks/guarded-link.yml
      vars:
        guarded_link_src: "{{ inventory_dir }}/kitty-tab-bar.py"
        guarded_link_dest: "{{ ansible_facts.env.HOME }}/.config/kitty/tab_bar.py"

    - name: Link kitty installation on Ubuntu
      ansible.builtin.file:
        src: "{{ inventory_dir }}/tarballs/kitty.app"
        dest: "{{ ansible_facts.env.HOME }}/.local/kitty.app"
        state: link
      when: dev_setup_platform == 'ubuntu'

    - name: Create local bin directory
      ansible.builtin.file:
        dest: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Link kitty binaries on Ubuntu
      ansible.builtin.file:
        src: "../kitty.app/bin/{{ item }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }}"
        state: link
      with_items:
        - kitty
        - kitten
      when: dev_setup_platform == 'ubuntu'

    - name: Link kitty binaries on macOS
      ansible.builtin.file:
        src: "/Applications/kitty.app/Contents/MacOS/{{ item }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }}"
        state: link
      with_items:
        - kitty
        - kitten
      when: dev_setup_platform == 'macos'

    - name: Clone kitty-themes
      ansible.builtin.git:
        repo: https://github.com/kovidgoyal/kitty-themes.git
        dest: "{{ inventory_dir }}/repos/kitty-themes"
        version: "{{ kitty_themes_commit }}"

    - name: Link kitty theme
      ansible.builtin.include_tasks: tasks/guarded-link.yml
      vars:
        guarded_link_src: "{{ inventory_dir }}/repos/kitty-themes/themes/Dracula.conf"
        guarded_link_dest: "{{ ansible_facts.env.HOME }}/.config/kitty/theme.conf"

    - name: Clone kitty-grab
      ansible.builtin.git:
        repo: https://github.com/yurikhan/kitty_grab.git
        dest: "{{ inventory_dir }}/repos/kitty_grab"
        version: "{{ kitty_grab_commit }}"

    - name: Link kitty-grab conf
      ansible.builtin.include_tasks: tasks/guarded-link.yml
      vars:
        guarded_link_src: "{{ inventory_dir }}/repos/kitty_grab/grab-vim.conf.example"
        guarded_link_dest: "{{ ansible_facts.env.HOME }}/.config/kitty/grab.conf"
