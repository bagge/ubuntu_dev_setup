---
- name: Check supported platform
  hosts: all
  tags: always
  vars:
    dev_setup_supported_ubuntu_versions:
      - "22.04"
      - "24.04"
      - "26.04"
    dev_setup_artifact_map:
      ubuntu_amd64:
        bazel_buildtools_target: linux-amd64
        bazelisk_asset: bazelisk-linux-amd64
        deb_arch: amd64
        glow_deb_arch: amd64
        golang_target: linux-amd64
        github_cli_archive_ext: tar.gz
        github_cli_target: linux_amd64
        kitty_target: x86_64
        mdcat_target: x86_64-unknown-linux-gnu
        nvim_archive_name: nvim-linux-x86_64
        toprepo_target: linux-x86_64
      macos_arm64:
        bazel_buildtools_target: darwin-arm64
        bazelisk_asset: bazelisk-darwin-arm64
        golang_target: darwin-arm64
        github_cli_archive_ext: zip
        github_cli_target: macOS_arm64
        mdcat_target: aarch64-apple-darwin
        nvim_archive_name: nvim-macos-arm64
  tasks:
    - name: Determine setup platform
      ansible.builtin.set_fact:
        dev_setup_platform: >-
          {%- if ansible_facts.system == 'Darwin' -%}
          macos{%- elif ansible_facts.distribution == 'Ubuntu' -%}
          ubuntu{%- else -%}
          unsupported{%- endif -%}
        dev_setup_arch: >-
          {%- if ansible_facts.architecture in ['x86_64', 'amd64'] -%}
          amd64{%- elif ansible_facts.architecture in ['arm64', 'aarch64'] -%}
          arm64{%- else -%}
          {{ ansible_facts.architecture }}{%- endif -%}

    - name: Determine setup platform and architecture key
      ansible.builtin.set_fact:
        dev_setup_platform_arch_key: "{{ dev_setup_platform }}_{{ dev_setup_arch }}"

    - name: Assert supported platform
      ansible.builtin.assert:
        that:
          - dev_setup_platform in ['ubuntu', 'macos']
          - dev_setup_platform_arch_key in dev_setup_artifact_map
        fail_msg: >-
          Unsupported platform: {{ ansible_facts.system }} {{ ansible_facts.distribution | default('') }}
          {{ ansible_facts.architecture }}. Supported platforms are Ubuntu amd64 and
          macOS Apple Silicon.

    - name: Assert supported Ubuntu release
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts.distribution_version in dev_setup_supported_ubuntu_versions
            or allow_unsupported_ubuntu_version | default(false) | bool
        fail_msg: >-
          Unsupported Ubuntu release {{ ansible_facts.distribution_version }}.
          Supported Ubuntu releases are
          {{ dev_setup_supported_ubuntu_versions | join(', ') }}. Set
          allow_unsupported_ubuntu_version=true to continue without tested support.
      when: dev_setup_platform == 'ubuntu'

    - name: Set platform artifact names
      ansible.builtin.set_fact:
        dev_setup_artifacts: "{{ dev_setup_artifact_map[dev_setup_platform_arch_key] }}"

    - name: Check for Homebrew on macOS
      ansible.builtin.stat:
        path: "{{ homebrew_prefix }}/bin/brew"
      register: homebrew_binary
      when: dev_setup_platform == 'macos'

    - name: Create tarballs directory for Homebrew installer on macOS
      ansible.builtin.file:
        path: "{{ inventory_dir }}/tarballs"
        state: directory
        mode: "0755"
      when:
        - dev_setup_platform == 'macos'
        - not homebrew_binary.stat.exists

    - name: Download Homebrew installer on macOS
      ansible.builtin.get_url:
        url: "{{ homebrew_install_url }}"
        dest: "{{ inventory_dir }}/tarballs/homebrew-install.sh"
        checksum: "sha256:{{ homebrew_install_checksum }}"
        mode: "0755"
      when:
        - dev_setup_platform == 'macos'
        - not homebrew_binary.stat.exists

    - name: Bootstrap Homebrew on macOS
      ansible.builtin.command: /bin/bash "{{ inventory_dir }}/tarballs/homebrew-install.sh"
      environment:
        NONINTERACTIVE: "1"
      args:
        creates: "{{ homebrew_prefix }}/bin/brew"
      when:
        - dev_setup_platform == 'macos'
        - not homebrew_binary.stat.exists

    - name: Check Homebrew prefix on macOS
      ansible.builtin.command: "{{ homebrew_prefix }}/bin/brew --prefix"
      register: homebrew_prefix_check
      changed_when: false
      when: dev_setup_platform == 'macos'

    - name: Assert Homebrew prefix on macOS
      ansible.builtin.assert:
        that:
          - homebrew_prefix_check.stdout == homebrew_prefix
        fail_msg: >-
          Expected Homebrew at {{ homebrew_prefix }}, but brew reported
          {{ homebrew_prefix_check.stdout }}.
      when: dev_setup_platform == 'macos'
