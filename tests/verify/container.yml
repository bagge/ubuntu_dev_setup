---
- name: Verify containerized workstation setup
  hosts: all
  gather_facts: true
  vars:
    expected_default_snippets:
      - 000-setup-location.bashrc
      - 004-bash-history.bashrc
      - 999-optional-auth.bashrc
      - 998-path-precedence.bashrc
    expected_tool_snippets:
      - 002-bash_it.bashrc
      - 003-bazel-helpers.bashrc
      - 005-fzf.bashrc
      - 006-nvim.bashrc
      - 006-nvm.bashrc
      - 007-golang.bashrc
    expected_local_bins:
      - bazel
      - bat
      - buildifier
      - buildozer
      - cat
      - gh
      - git-toprepo
      - kitten
      - kitty
      - mdcat
      - nvim
      - plantuml
      - repo
      - tree-sitter
    expected_ubuntu_2204_local_bins:
      - vale-ls
    expected_llm_cli_bins:
      - codex
      - copilot
      - opencode
  tasks:
    - name: Collect package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Check managed bashrc symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.bashrc"
      register: bashrc_link

    - name: Check managed bashrc.d symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.bashrc.d"
      register: bashrc_d_link

    - name: Assert bashrc links point into the test workspace
      ansible.builtin.assert:
        that:
          - bashrc_link.stat.islnk
          - bashrc_link.stat.lnk_source == inventory_dir + "/bashrc"
          - bashrc_d_link.stat.islnk
          - bashrc_d_link.stat.lnk_source == inventory_dir + "/bashrc.d"

    - name: Check managed kitty configuration symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.config/kitty/kitty.conf"
      register: kitty_config_link

    - name: Check managed kitty tab bar renderer symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.config/kitty/tab_bar.py"
      register: kitty_tab_bar_link

    - name: Read kitty configuration
      ansible.builtin.slurp:
        src: "{{ ansible_facts.env.HOME }}/.config/kitty/kitty.conf"
      register: kitty_config

    - name: Assert kitty links point into the test workspace
      ansible.builtin.assert:
        that:
          - kitty_config_link.stat.islnk
          - kitty_config_link.stat.lnk_source == inventory_dir + "/kitty.conf"
          - kitty_tab_bar_link.stat.islnk
          - kitty_tab_bar_link.stat.lnk_source == inventory_dir + "/kitty-tab-bar.py"
          - "'tab_bar_style custom' in (kitty_config.content | b64decode).splitlines()"

    - name: Check enabled bash snippets
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/bashrc.d/enabled/{{ item }}"
      loop: "{{ expected_default_snippets + expected_tool_snippets }}"
      register: enabled_snippets

    - name: Assert enabled bash snippets are symlinks
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
      loop: "{{ enabled_snippets.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check expected local binaries
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }}"
      loop: >-
        {{
          expected_local_bins
          + (
            expected_ubuntu_2204_local_bins
            if ansible_facts.distribution_version == '22.04'
            else []
          )
          + (expected_llm_cli_bins if install_llm_clis | bool else [])
        }}
      register: local_bins

    - name: Assert expected local binaries exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.executable or item.stat.islnk
      loop: "{{ local_bins.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert expected apt packages are installed
      ansible.builtin.assert:
        that:
          - item in ansible_facts.packages
      loop:
        - bat
        - curl
        - default-jre
        - git
        - graphviz
        - jq
        - python3-pip
        - python3-psutil
        - ranger

    - name: Check Google Chrome deb822 apt repository
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/google-chrome.sources
      register: google_chrome_apt_sources
      when: install_google_chrome | bool

    - name: Read Google Chrome apt repository list
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/google-chrome.list
      register: google_chrome_apt_list
      when: install_google_chrome | bool

    - name: Check Google Chrome apt defaults
      ansible.builtin.stat:
        path: /etc/default/google-chrome
      register: google_chrome_default_file
      when: install_google_chrome | bool

    - name: Read Google Chrome apt defaults
      ansible.builtin.slurp:
        src: /etc/default/google-chrome
      register: google_chrome_default
      when:
        - install_google_chrome | bool
        - google_chrome_default_file.stat.exists

    - name: Assert Google Chrome apt source is valid
      ansible.builtin.assert:
        that:
          - "'google-chrome-stable' in ansible_facts.packages"
          - not google_chrome_apt_sources.stat.exists
          - google_chrome_apt_repo_lines | length == 1
          - >-
            google_chrome_signed_repo_lines | length == 1
            or google_chrome_unsigned_repo_lines | length == 1
          - >-
            google_chrome_unsigned_repo_lines | length == 1
            or 'repo_add_once="false"' in google_chrome_defaults
          - >-
            google_chrome_unsigned_repo_lines | length == 1
            or 'repo_reenable_on_distupgrade="false"' in google_chrome_defaults
      vars:
        google_chrome_repo_line_pattern: >-
          ^\s*deb\s+(\[[^]]*\]\s+)?https?://dl\.google\.com/linux/chrome/deb/?\s+stable\s+main\s*$
        google_chrome_apt_lines: "{{ (google_chrome_apt_list.content | b64decode).splitlines() }}"
        google_chrome_apt_repo_lines: >-
          {{
            google_chrome_apt_lines
            | select('match', google_chrome_repo_line_pattern)
            | list
          }}
        google_chrome_signed_repo_lines: >-
          {{
            google_chrome_apt_repo_lines
            | select('search', 'signed-by=')
            | list
          }}
        google_chrome_unsigned_repo_lines: >-
          {{
            google_chrome_apt_repo_lines
            | reject('search', 'signed-by=')
            | list
          }}
        google_chrome_defaults: "{{ google_chrome_default.content | default('') | b64decode }}"
      when: install_google_chrome | bool

    - name: Read source Git version # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/opt/git-current/bin/git --version"
      changed_when: false
      register: source_git_version_result

    - name: Resolve Git in interactive shell # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - bash
          - -ic
          - command -v git
      changed_when: false
      register: resolved_git_command

    - name: Assert source Git version and PATH precedence
      ansible.builtin.assert:
        that:
          - source_git_version_result.stdout == "git version " + git_version
          - resolved_git_command.stdout == ansible_facts.env.HOME + "/.local/opt/git-current/bin/git"

    - name: Resolve LLM CLI wrappers in interactive shell # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - bash
          - -ic
          - command -v {{ item }}
      loop: "{{ expected_llm_cli_bins }}"
      changed_when: false
      register: resolved_llm_cli_wrappers
      when: install_llm_clis | bool

    - name: Assert LLM CLI wrappers take PATH precedence
      ansible.builtin.assert:
        that:
          - item.stdout == ansible_facts.env.HOME + "/.local/bin/" + item.item
      loop: "{{ resolved_llm_cli_wrappers.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: install_llm_clis | bool

    - name: Check source Git man page exists
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.local/opt/git-{{ git_version }}/share/man/man1/git-checkout.1"
      register: git_man_page

    - name: Assert source Git man page is installed
      ansible.builtin.assert:
        that:
          - git_man_page.stat.exists

    - name: Read GitHub CLI version # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/gh --version"
      changed_when: false
      register: github_cli_version_result

    - name: Assert GitHub CLI version
      ansible.builtin.assert:
        that:
          - github_cli_version_result.stdout_lines[0] is match("^gh version " + github_cli_version + "( |$)")

    - name: Read git editor config # noqa command-instead-of-module
      ansible.builtin.command: git config --global core.editor
      changed_when: false
      register: git_editor

    - name: Read git excludesfile config # noqa command-instead-of-module
      ansible.builtin.command: git config --global core.excludesfile
      changed_when: false
      register: git_excludesfile

    - name: Assert git global config
      ansible.builtin.assert:
        that:
          - git_editor.stdout == "nvim"
          - git_excludesfile.stdout == ansible_facts.env.HOME + "/.gitignore"

    - name: Read interactive shell editor variables # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - bash
          - -ic
          - printf '%s\n%s\n' "${EDITOR:-}" "${VISUAL:-}"
      changed_when: false
      register: shell_editor_variables

    - name: Assert interactive shell editor variables
      ansible.builtin.assert:
        that:
          - shell_editor_variables.stdout_lines == ["nvim", "nvim"]

    - name: Read nvm version # noqa command-instead-of-module
      ansible.builtin.shell: |
        . "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
        nvm --version
      args:
        executable: /bin/bash
      changed_when: false
      register: nvm_version_result

    - name: Read Node.js version # noqa command-instead-of-module
      ansible.builtin.shell: |
        . "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
        node --version
      args:
        executable: /bin/bash
      changed_when: false
      register: node_version_result

    - name: Read default Node.js version # noqa command-instead-of-module
      ansible.builtin.shell: |
        . "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
        nvm version default
      args:
        executable: /bin/bash
      changed_when: false
      register: default_node_version

    - name: Assert nvm and Node.js versions
      ansible.builtin.assert:
        that:
          - nvm_version_result.stdout == nvm_version
          - node_version_result.stdout is match("^v" + (node_major_version | string) + "\\.")
          - default_node_version.stdout is match("^v" + (node_major_version | string) + "\\.")

    - name: Check PlantUML jar symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.local/bin/plantuml.jar"
      register: plantuml_jar_link

    - name: Assert PlantUML jar symlink exists
      ansible.builtin.assert:
        that:
          - plantuml_jar_link.stat.exists
          - plantuml_jar_link.stat.islnk

    - name: Read PlantUML version # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/plantuml -version"
      changed_when: false
      register: plantuml_version_result

    - name: Assert PlantUML version
      ansible.builtin.assert:
        that:
          - ("PlantUML version " + plantuml_version) in plantuml_version_result.stdout

    - name: Read Tree-sitter CLI version # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/tree-sitter --version"
      changed_when: false
      register: tree_sitter_version_result

    - name: Assert Tree-sitter CLI version
      ansible.builtin.assert:
        that:
          - tree_sitter_version_result.stdout is match("^tree-sitter " + tree_sitter_version + "( |$)")

    - name: Read vale-ls version on Ubuntu 22.04 # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/vale-ls --version"
      changed_when: false
      register: vale_ls_version_result
      when: ansible_facts.distribution_version == '22.04'

    - name: Read vale-ls version marker on Ubuntu 22.04
      ansible.builtin.slurp:
        src: "{{ ansible_facts.env.HOME }}/.local/.vale-ls-version"
      register: vale_ls_version_marker
      when: ansible_facts.distribution_version == '22.04'

    - name: Assert vale-ls installation on Ubuntu 22.04
      ansible.builtin.assert:
        that:
          - vale_ls_version_result.stdout | length > 0
          - (vale_ls_version_marker.content | b64decode | trim) == vale_ls_version
      when: ansible_facts.distribution_version == '22.04'

    - name: Read LLM CLI versions # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }} --version"
      changed_when: false
      loop:
        - codex
        - copilot
        - opencode
      register: llm_cli_versions
      when: install_llm_clis | bool

    - name: Assert LLM CLI version output
      ansible.builtin.assert:
        that:
          - item.stdout | length > 0
      loop: "{{ llm_cli_versions.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: install_llm_clis | bool

    - name: Read global gitignore
      ansible.builtin.slurp:
        src: "{{ ansible_facts.env.HOME }}/.gitignore"
      register: global_gitignore

    - name: Assert global gitignore contains go.sum
      ansible.builtin.assert:
        that:
          - "'go.sum' in (global_gitignore.content | b64decode).splitlines()"

    - name: Check proprietary packages are absent in test mode
      ansible.builtin.assert:
        that:
          - "'google-chrome-stable' not in ansible_facts.packages"
          - "'docker.io' not in ansible_facts.packages"
      when: test_mode | default(false) | bool
