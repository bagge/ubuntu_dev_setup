---
- name: Verify containerized workstation setup
  hosts: all
  gather_facts: true
  vars:
    expected_default_snippets:
      - 000-setup-location.bashrc
      - 004-bash-history.bashrc
      - 999-optional-auth.bashrc
    expected_tool_snippets:
      - 002-bash_it.bashrc
      - 003-bazel-helpers.bashrc
      - 005-fzf.bashrc
      - 006-nvm.bashrc
      - 007-golang.bashrc
    expected_local_bins:
      - bazel
      - bat
      - buildifier
      - buildozer
      - cat
      - gh
      - git-toprepo
      - kitten
      - kitty
      - mdcat
      - nvim
      - repo
      - unused_deps
    expected_llm_cli_bins:
      - codex
      - copilot
      - opencode
  tasks:
    - name: Collect package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Check managed bashrc symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.bashrc"
      register: bashrc_link

    - name: Check managed bashrc.d symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.bashrc.d"
      register: bashrc_d_link

    - name: Assert bashrc links point into the test workspace
      ansible.builtin.assert:
        that:
          - bashrc_link.stat.islnk
          - bashrc_link.stat.lnk_source == inventory_dir + "/bashrc"
          - bashrc_d_link.stat.islnk
          - bashrc_d_link.stat.lnk_source == inventory_dir + "/bashrc.d"

    - name: Check enabled bash snippets
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/bashrc.d/enabled/{{ item }}"
      loop: "{{ expected_default_snippets + expected_tool_snippets }}"
      register: enabled_snippets

    - name: Assert enabled bash snippets are symlinks
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
      loop: "{{ enabled_snippets.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check expected local binaries
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }}"
      loop: "{{ expected_local_bins + (expected_llm_cli_bins if install_llm_clis | bool else []) }}"
      register: local_bins

    - name: Assert expected local binaries exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.executable or item.stat.islnk
      loop: "{{ local_bins.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert expected apt packages are installed
      ansible.builtin.assert:
        that:
          - item in ansible_facts.packages
      loop:
        - bat
        - curl
        - git
        - jq
        - python3-pip
        - python3-psutil
        - ranger

    - name: Read source Git version # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/opt/git-current/bin/git --version"
      changed_when: false
      register: source_git_version_result

    - name: Resolve Git in interactive shell # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - bash
          - -ic
          - command -v git
      changed_when: false
      register: resolved_git_command

    - name: Assert source Git version and PATH precedence
      ansible.builtin.assert:
        that:
          - source_git_version_result.stdout == "git version " + git_version
          - resolved_git_command.stdout == ansible_facts.env.HOME + "/.local/opt/git-current/bin/git"

    - name: Check source Git man page exists
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.local/opt/git-{{ git_version }}/share/man/man1/git-checkout.1"
      register: git_man_page

    - name: Assert source Git man page is installed
      ansible.builtin.assert:
        that:
          - git_man_page.stat.exists

    - name: Read GitHub CLI version # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/gh --version"
      changed_when: false
      register: github_cli_version_result

    - name: Assert GitHub CLI version
      ansible.builtin.assert:
        that:
          - github_cli_version_result.stdout_lines[0] is match("^gh version " + github_cli_version + "( |$)")

    - name: Read git editor config # noqa command-instead-of-module
      ansible.builtin.command: git config --global core.editor
      changed_when: false
      register: git_editor

    - name: Read git excludesfile config # noqa command-instead-of-module
      ansible.builtin.command: git config --global core.excludesfile
      changed_when: false
      register: git_excludesfile

    - name: Assert git global config
      ansible.builtin.assert:
        that:
          - git_editor.stdout == "nvim"
          - git_excludesfile.stdout == ansible_facts.env.HOME + "/.gitignore"

    - name: Read nvm version # noqa command-instead-of-module
      ansible.builtin.shell: |
        . "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
        nvm --version
      args:
        executable: /bin/bash
      changed_when: false
      register: nvm_version_result

    - name: Read Node.js version # noqa command-instead-of-module
      ansible.builtin.shell: |
        . "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
        node --version
      args:
        executable: /bin/bash
      changed_when: false
      register: node_version_result

    - name: Read default Node.js version # noqa command-instead-of-module
      ansible.builtin.shell: |
        . "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
        nvm version default
      args:
        executable: /bin/bash
      changed_when: false
      register: default_node_version

    - name: Assert nvm and Node.js versions
      ansible.builtin.assert:
        that:
          - nvm_version_result.stdout == nvm_version
          - node_version_result.stdout is match("^v" + (node_major_version | string) + "\\.")
          - default_node_version.stdout is match("^v" + (node_major_version | string) + "\\.")

    - name: Read LLM CLI versions # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }} --version"
      changed_when: false
      loop:
        - codex
        - copilot
        - opencode
      register: llm_cli_versions
      when: install_llm_clis | bool

    - name: Assert LLM CLI version output
      ansible.builtin.assert:
        that:
          - item.stdout | length > 0
      loop: "{{ llm_cli_versions.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: install_llm_clis | bool

    - name: Read global gitignore
      ansible.builtin.slurp:
        src: "{{ ansible_facts.env.HOME }}/.gitignore"
      register: global_gitignore

    - name: Assert global gitignore contains go.sum
      ansible.builtin.assert:
        that:
          - "'go.sum' in (global_gitignore.content | b64decode).splitlines()"

    - name: Check proprietary packages are absent in test mode
      ansible.builtin.assert:
        that:
          - "'google-chrome-stable' not in ansible_facts.packages"
          - "'docker.io' not in ansible_facts.packages"
      when: test_mode | default(false) | bool
