---
- name: Verify macOS workstation setup
  hosts: all
  gather_facts: true
  vars:
    expected_default_snippets:
      - 000-setup-location.bashrc
      - 001-homebrew.bashrc
      - 004-bash-history.bashrc
      - 999-optional-auth.bashrc
      - 998-path-precedence.bashrc
    expected_tool_snippets:
      - 002-bash_it.bashrc
      - 003-bazel-helpers.bashrc
      - 005-fzf.bashrc
      - 006-nvim.bashrc
      - 006-nvm.bashrc
      - 007-golang.bashrc
    expected_local_bins:
      - bazel
      - bat
      - buildifier
      - buildozer
      - cat
      - gh
      - git-toprepo
      - kitten
      - kitty
      - nvim
      - plantuml
      - repo
    expected_llm_cli_bins:
      - codex
      - copilot
      - opencode
    expected_formulae:
      - ansible-lint
      - bash
      - bat
      - bmon
      - curl
      - fzf
      - git
      - glow
      - graphviz
      - jq
      - openjdk
      - ranger
      - ripgrep
      - rust
      - shellcheck
      - shfmt
      - stylua
      - tree-sitter-cli
    expected_casks:
      - font-hack-nerd-font
      - kitty
  tasks:
    - name: Assert Apple Silicon macOS
      ansible.builtin.assert:
        that:
          - ansible_facts.system == "Darwin"
          - ansible_facts.architecture == "arm64"

    - name: Check Homebrew
      ansible.builtin.stat:
        path: "{{ homebrew_prefix }}/bin/brew"
      register: homebrew_binary

    - name: Assert Homebrew exists
      ansible.builtin.assert:
        that:
          - homebrew_binary.stat.exists
          - homebrew_binary.stat.executable

    - name: Check managed bashrc symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.bashrc"
      register: bashrc_link

    - name: Check managed bash_profile symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.bash_profile"
      register: bash_profile_link

    - name: Check managed bashrc.d symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.bashrc.d"
      register: bashrc_d_link

    - name: Assert bash links point into the workspace
      ansible.builtin.assert:
        that:
          - bashrc_link.stat.islnk
          - bashrc_link.stat.lnk_source == inventory_dir + "/bashrc"
          - bash_profile_link.stat.islnk
          - bash_profile_link.stat.lnk_source == inventory_dir + "/bash_profile"
          - bashrc_d_link.stat.islnk
          - bashrc_d_link.stat.lnk_source == inventory_dir + "/bashrc.d"

    - name: Check enabled bash snippets
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/bashrc.d/enabled/{{ item }}"
      loop: "{{ expected_default_snippets + expected_tool_snippets }}"
      register: enabled_snippets

    - name: Assert enabled bash snippets are symlinks
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
      loop: "{{ enabled_snippets.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check expected local binaries
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }}"
      loop: "{{ expected_local_bins + (expected_llm_cli_bins if install_llm_clis | bool else []) }}"
      register: local_bins

    - name: Assert expected local binaries exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.executable or item.stat.islnk
      loop: "{{ local_bins.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert expected Homebrew formulae are installed
      ansible.builtin.command: "{{ homebrew_prefix }}/bin/brew list --formula {{ item }}"
      changed_when: false
      loop: "{{ expected_formulae }}"

    - name: Assert expected Homebrew casks are installed
      ansible.builtin.command: "{{ homebrew_prefix }}/bin/brew list --cask {{ item }}"
      changed_when: false
      loop: "{{ expected_casks }}"

    - name: Read GitHub CLI version # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/gh --version"
      changed_when: false
      register: github_cli_version_result

    - name: Assert GitHub CLI version
      ansible.builtin.assert:
        that:
          - github_cli_version_result.stdout_lines[0] is match("^gh version " + github_cli_version + "( |$)")

    - name: Read git editor config # noqa command-instead-of-module
      ansible.builtin.command: git config --global core.editor
      changed_when: false
      register: git_editor

    - name: Read git excludesfile config # noqa command-instead-of-module
      ansible.builtin.command: git config --global core.excludesfile
      changed_when: false
      register: git_excludesfile

    - name: Assert git global config
      ansible.builtin.assert:
        that:
          - git_editor.stdout == "nvim"
          - git_excludesfile.stdout == ansible_facts.env.HOME + "/.gitignore"

    - name: Read interactive shell editor variables # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - bash
          - -ic
          - printf '%s\n%s\n' "${EDITOR:-}" "${VISUAL:-}"
      changed_when: false
      register: shell_editor_variables

    - name: Assert interactive shell editor variables
      ansible.builtin.assert:
        that:
          - shell_editor_variables.stdout_lines == ["nvim", "nvim"]

    - name: Read nvm version # noqa command-instead-of-module
      ansible.builtin.shell: |
        . "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
        nvm --version
      args:
        executable: /bin/bash
      changed_when: false
      register: nvm_version_result

    - name: Read Node.js version # noqa command-instead-of-module
      ansible.builtin.shell: |
        . "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
        node --version
      args:
        executable: /bin/bash
      changed_when: false
      register: node_version_result

    - name: Read default Node.js version # noqa command-instead-of-module
      ansible.builtin.shell: |
        . "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
        nvm version default
      args:
        executable: /bin/bash
      changed_when: false
      register: default_node_version

    - name: Assert nvm and Node.js versions
      ansible.builtin.assert:
        that:
          - nvm_version_result.stdout == nvm_version
          - node_version_result.stdout is match("^v" + (node_major_version | string) + "\\.")
          - default_node_version.stdout is match("^v" + (node_major_version | string) + "\\.")

    - name: Resolve LLM CLI wrappers in interactive shell # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - bash
          - -ic
          - command -v {{ item }}
      loop: "{{ expected_llm_cli_bins }}"
      changed_when: false
      register: resolved_llm_cli_wrappers
      when: install_llm_clis | bool

    - name: Assert LLM CLI wrappers take PATH precedence
      ansible.builtin.assert:
        that:
          - item.stdout == ansible_facts.env.HOME + "/.local/bin/" + item.item
      loop: "{{ resolved_llm_cli_wrappers.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: install_llm_clis | bool

    - name: Check PlantUML jar symlink
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.local/bin/plantuml.jar"
      register: plantuml_jar_link

    - name: Assert PlantUML jar symlink exists
      ansible.builtin.assert:
        that:
          - plantuml_jar_link.stat.exists
          - plantuml_jar_link.stat.islnk

    - name: Read PlantUML version # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/plantuml -version"
      changed_when: false
      register: plantuml_version_result

    - name: Assert PlantUML version
      ansible.builtin.assert:
        that:
          - ("PlantUML version " + plantuml_version) in plantuml_version_result.stdout

    - name: Read Tree-sitter CLI version # noqa command-instead-of-module
      ansible.builtin.command: "{{ homebrew_prefix }}/bin/tree-sitter --version"
      changed_when: false
      register: tree_sitter_version_result

    - name: Assert Tree-sitter CLI is available
      ansible.builtin.assert:
        that:
          - tree_sitter_version_result.stdout is match("^tree-sitter [0-9]+\\.[0-9]+\\.[0-9]+( |$)")

    - name: Read LLM CLI versions # noqa command-instead-of-module
      ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }} --version"
      changed_when: false
      loop:
        - codex
        - copilot
        - opencode
      register: llm_cli_versions
      when: install_llm_clis | bool

    - name: Assert LLM CLI version output
      ansible.builtin.assert:
        that:
          - item.stdout | length > 0
      loop: "{{ llm_cli_versions.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: install_llm_clis | bool

    - name: Read global gitignore
      ansible.builtin.slurp:
        src: "{{ ansible_facts.env.HOME }}/.gitignore"
      register: global_gitignore

    - name: Assert global gitignore contains go.sum
      ansible.builtin.assert:
        that:
          - "'go.sum' in (global_gitignore.content | b64decode).splitlines()"
