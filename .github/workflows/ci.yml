name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible pipx
          pipx install ansible-lint
          ansible-galaxy collection install -r requirements.yml
      - name: Run linter
        run: |
          ansible-lint setup.yml

  shell-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shell checks
        run: |
          bash tests/shell/check.sh

  container-integration:
    strategy:
      matrix:
        ubuntu-version: ["22.04", "24.04"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Run containerized integration test
        run: |
          bash tests/container/run.sh "${{ matrix.ubuntu-version }}"

  macos-integration:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install ansible shellcheck
      - name: Run macOS integration test
        run: |
          bash tests/macos/run.sh
